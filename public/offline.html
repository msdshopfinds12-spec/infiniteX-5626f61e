<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <title>Offline · InfiniteX</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#070b14;color:#f1f5f9}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,480px);padding:28px;border:1px solid #334155;border-radius:18px;background:#0b1220}
    p{color:#cbd5e1;line-height:1.6}
    a{display:inline-flex;min-height:44px;align-items:center;padding:10px 16px;border-radius:10px;background:#1d4ed8;color:#fff;text-decoration:none;font-weight:650}
  </style>
</head>
<body>
  <main>
    <p>INFINITEX · OFFLINE MODE</p>
    <h1>You are offline</h1>
    <p>The workspace shell is available when cached. Reconnect to refresh content and retry this page.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
