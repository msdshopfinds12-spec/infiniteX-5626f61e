name: Phase 54 Dependency Remediation (Read Only)

on:
  pull_request:
    branches:
      - "engineering/phase-54-vite8-security-remediation"
    paths:
      - ".github/workflows/dependency-remediation.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - "engineering/phase-54-*"
    paths:
      - ".github/workflows/dependency-remediation.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

# Verification jobs must never receive repository write authority.
permissions:
  contents: read

concurrency:
  group: phase-54-dependency-remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate-and-verify:
    name: Generate candidate manifests and run application gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up supported Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Record runtime versions
        run: |
          node --version
          npm --version

      - name: Generate candidate lockfile for patched Vite toolchain
        run: |
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact vite@8.3.8 @vitejs/plugin-react@6.3.0
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); const l=JSON.parse(fs.readFileSync('package-lock.json','utf8')); if(p.devDependencies?.vite!=='8.3.8'||p.devDependencies?.['@vitejs/plugin-react']!=='6.3.0'||l.packages?.['']?.devDependencies?.vite!=='8.3.8'||l.packages?.['']?.devDependencies?.['@vitejs/plugin-react']!=='6.3.0') process.exit(1); console.log('Manifest and lockfile root dependency declarations match the isolated target versions.');"

      - name: Install exactly from generated candidate lockfile
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--trace-deprecation npm ci 2>&1 | tee npm-install.log

      - name: Run dependency security audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          set -e
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const counts = report.metadata?.vulnerabilities ?? {};
            console.log(JSON.stringify({ counts, vulnerabilities: report.vulnerabilities ?? {} }, null, 2));
            if ((counts.total ?? 0) !== 0) process.exit(1);
          '
          test "$audit_status" -eq 0

      - name: TypeScript validation
        run: npm run lint

      - name: Application regression tests
        run: npm run test:app

      - name: Production build
        run: npm run build

      - name: Verify production entry point
        run: test -s dist/index.html

      # This workflow intentionally does not commit or push. A human reviews
      # the generated manifests and applies them through a normal pull request.
      - name: Upload candidate manifests and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-54-dependency-remediation-candidate
          path: |
            package.json
            package-lock.json
            npm-audit.json
            npm-install.log
          if-no-files-found: warn
          retention-days: 7
