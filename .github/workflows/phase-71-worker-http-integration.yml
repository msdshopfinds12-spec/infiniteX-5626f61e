name: Phase 71 Worker HTTP Boundary Verification

on:
  pull_request:
    branches:
      - engineering/infinitex-canonical-integration-candidate
  push:
    branches:
      - phase-71/worker-http-integration

permissions:
  contents: read

concurrency:
  group: phase-71-worker-http-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 worker boundary and application gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.12
      - name: Configure Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Record runtime and exact revision
        run: |
          node --version
          npm --version
          git rev-parse HEAD
      - name: Install locked dependencies
        run: npm ci
      - name: Deno worker HTTP integration tests
        run: deno test --no-check supabase/functions/simula-workflow-worker/index.deno.ts
      - name: Worker authentication boundary tests
        run: npm run test:worker-http-boundary
      - name: Existing worker and CORS security tests
        run: npm run test:edge-function-security
      - name: Full Node regression suite
        run: npm test
      - name: TypeScript lint
        run: npm run lint
      - name: Production build
        run: npm run build
