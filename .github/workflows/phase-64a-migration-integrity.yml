name: Phase 64A Migration Integrity

on:
  push:
    branches:
      - engineering/phase-64a-migration-provenance
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "docs/database/MIGRATION-*.json"
      - "scripts/*migration*.mjs"
      - "scripts/audit-migration-side-effects.mjs"
      - "tests/database/*migration*.test.mjs"
      - ".github/workflows/phase-64a-migration-integrity.yml"

permissions:
  contents: read

concurrency:
  group: phase-64a-migration-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-integrity:
    name: Offline provenance and migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify recovered migration SHA-256 manifest
        run: node scripts/verify-recovered-migration-manifest.mjs
      - name: Verify migration filename and version integrity
        run: node scripts/check-migration-integrity.mjs
      - name: Verify applied versus candidate provenance
        run: node scripts/verify-migration-provenance.mjs
      - name: Audit migration side effects
        run: node scripts/audit-migration-side-effects.mjs
      - name: Run migration integrity tests
        run: node --test tests/database/check-migration-integrity.test.mjs
      - name: Run migration provenance tests
        run: node --test tests/database/migration-provenance.test.mjs
      - name: Run side-effect audit tests
        run: node --test tests/database/migration-side-effect-audit.test.mjs
