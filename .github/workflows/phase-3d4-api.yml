name: Phase 3D-4 API Foundation

on:
  pull_request:
    branches:
      - feat/phase-3d4-trusted-backend
    paths:
      - "apps/api/**"
      - ".github/workflows/phase-3d4-api.yml"
  push:
    branches:
      - feat/phase-3d4-trusted-backend
    paths:
      - "apps/api/**"
      - ".github/workflows/phase-3d4-api.yml"

permissions:
  contents: read

concurrency:
  group: phase-3d4-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-foundation:
    name: Node API syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax and run tests
        run: npm run check
