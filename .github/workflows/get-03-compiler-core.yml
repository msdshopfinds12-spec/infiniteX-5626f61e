name: GET-03 Compiler Core

on:
  push:
    branches:
      - feat/get-03-compiler-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: get-03-compiler-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: TypeScript checks
        run: npm run lint

      - name: Compiler and numeric regression tests
        run: npm test

      - name: Production build
        run: npm run build
