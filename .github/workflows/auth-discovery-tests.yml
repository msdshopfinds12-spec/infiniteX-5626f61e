name: InfiniteX Backend Quality Gate

on:
  push:
    branches:
      - feat/provider-neutral-billing-sandbox
    paths:
      - "scripts/auth/**"
      - "server/**"
      - "tests/auth/**"
      - "tests/server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/auth-discovery-tests.yml"
  pull_request:
    branches:
      - feat/provider-neutral-billing-sandbox
    paths:
      - "scripts/auth/**"
      - "server/**"
      - "tests/auth/**"
      - "tests/server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/auth-discovery-tests.yml"

permissions:
  contents: read

concurrency:
  group: auth-discovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Authentication and backend runtime tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run backend and authentication tests
        run: npm run test:backend
