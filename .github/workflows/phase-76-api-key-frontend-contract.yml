name: Phase 76 API-key Frontend Contract
on:
  push:
    branches:
      - phase-76/api-key-frontend-contract
    paths:
      - 'src/features/security/**'
      - 'tests/security/**'
      - 'supabase/functions/ashaa-api-key-manager/index.ts'
      - 'package.json'
      - '.github/workflows/phase-76-api-key-frontend-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-key-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test API-key service and metadata contract
        run: npm run test:api-key-service
      - name: TypeScript lint
        run: npm run lint
      - name: Production build
        run: npm run build
