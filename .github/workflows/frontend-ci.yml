name: InfiniteX Frontend CI

on:
  push:
    branches:
      - feat/infiniteX-zero-budget-implementation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: infinitex-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, dependency audit and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Run unit and policy tests
        run: npm test
      - name: Enforce browser/server import boundary
        run: npm run check:browser-boundary
      - name: Build production assets
        run: npm run build
      - name: Install temporary browser-test tooling without changing the lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0
      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility regression tests
        run: npm run test:e2e
      - name: Block release on moderate or higher dependency advisories
        run: npm audit --audit-level=moderate
