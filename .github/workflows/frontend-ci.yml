name: Frontend CI

on:
  push:
    branches:
      - chore/phase-3d4-ci-recovery
      - chore/phase-3d4-p0-hardening
      - chore/phase-3b-frontend-foundation
      - fix/phase-3d1-ci-security-hardening
      - fix/phase-3d2-frontend-security
      - feat/phase-3d3-ai-orchestration-foundation
      - feat/phase-3d4-trusted-backend
      - fix/phase-4m1a-ci-coverage
      - fix/phase-4m1b-browser-boundary
      - fix/phase-4m2b-edge-worker-hardening
      - fix/phase-4m2c-deno-tenant-isolation
      - fix/phase-4m4-picomatch-security-recovery
      - fix/phase-4m4-picomatch-regression-tests
  pull_request:
    branches:
      - main
      - feat/gh16-infiniteX-integration
      - chore/phase-3b-frontend-foundation
      - fix/phase-3d1-ci-security-hardening
      - fix/phase-3d2-frontend-security
      - feat/phase-3d4-trusted-backend
      - phase-4m-ai-orchestration-readiness
      - fix/phase-4m1a-ci-coverage
      - fix/phase-4m1b-browser-boundary
      - fix/phase-4m2b-edge-worker-hardening
      - fix/phase-4m2c-deno-tenant-isolation

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit test, dependency audit and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source (immutable action pin)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js (immutable action pin)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce workflow security policy
        run: npm run check:ci-policy
      - name: Test workflow policy scanner
        run: npm run test:ci-policy
      - name: Enforce browser/server import boundary
        run: npm run check:browser-boundary
      - name: Test browser/server import boundary
        run: npm run test:browser-boundary
      - name: Edge Function security source checks
        run: npm run check:edge-function-security
      - name: Test exact-origin CORS policy
        run: npm run test:edge-function-cors
      - name: Test Edge worker ownership and request-boundary policies
        run: npm run test:edge-worker-security
      - name: Dependency security audit
        id: dependency_audit
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Enforce dependency audit result
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" != "success" ]; then
            echo "Dependency audit failed; release remains blocked."
            exit 1
          fi

  deno-worker-security:
    name: Deno worker runtime tests and type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source (immutable action pin)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Deno (immutable action pin)
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.8
      - name: Run Deno-native worker security tests
        run: deno test --no-lock supabase/functions/_shared/worker-security.deno.ts
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --node-modules-dir=auto --no-lock supabase/functions/simula-workflow-worker/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/simula-workflow-cron-worker/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/ashaa-api-key-manager/index.ts

  # Browser job intentionally skips npm cache to avoid concurrent same-key cache writes.
  browser-e2e:
    name: Playwright and axe accessibility browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout source (immutable action pin)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js (immutable action pin)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production assets
        run: npm run build
      - name: Run browser and WCAG accessibility tests
        run: npm run test:e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
