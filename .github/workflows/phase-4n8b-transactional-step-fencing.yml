name: Phase 4N.8B Transactional Step Fencing

on:
  push:
    branches:
      - fix/phase-4n8b-transactional-step-fencing-impl
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase-4n8b-transactional-step-fencing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Worker tests, Deno checks, and application build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Node security and CORS regressions
        run: npm run test:edge-function-security
      - name: Set up Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.2.12
      - name: Run worker security regression suite
        run: deno test --no-lock supabase/functions/_shared/worker-security.deno.ts
      - name: Type-check authenticated worker
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/simula-workflow-worker/index.ts
      - name: Type-check cron worker
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/simula-workflow-cron-worker/index.ts
      - name: Type-check transactional integration test
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/_shared/transactional-step-fencing.integration.test.ts
      - name: Run transactional integration test against a local-only Supabase fixture
        if: ${{ vars.PHASE_4N8B_FIXTURE_READY == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.PHASE_4N8B_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PHASE_4N8B_SUPABASE_SERVICE_ROLE_KEY }}
          PHASE_4N8B_TEST_RUN_ID: ${{ secrets.PHASE_4N8B_TEST_RUN_ID }}
          PHASE_4N8B_TEST_STEP_ID: ${{ secrets.PHASE_4N8B_TEST_STEP_ID }}
          PHASE_4N8B_TEST_OWNER_ID: ${{ secrets.PHASE_4N8B_TEST_OWNER_ID }}
          PHASE_4N8B_TEST_ATTEMPT: ${{ secrets.PHASE_4N8B_TEST_ATTEMPT }}
        run: deno test --no-lock --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,PHASE_4N8B_TEST_RUN_ID,PHASE_4N8B_TEST_STEP_ID,PHASE_4N8B_TEST_OWNER_ID,PHASE_4N8B_TEST_ATTEMPT --allow-net=localhost,127.0.0.1 supabase/functions/_shared/transactional-step-fencing.integration.test.ts
      - name: Report integration test as not run when no isolated fixture is configured
        if: ${{ vars.PHASE_4N8B_FIXTURE_READY != 'true' }}
        run: |
          echo '### Phase 4N.8B integration test: NOT RUN' >> "$GITHUB_STEP_SUMMARY"
          echo 'No isolated fixture has been approved/configured. Source checks continue, but database concurrency is not verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build application and type-check TypeScript
        run: npm run build
