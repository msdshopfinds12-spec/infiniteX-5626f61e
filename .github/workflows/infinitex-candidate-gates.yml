name: InfiniteX Candidate Quality Gates

on:
  push:
    branches:
      - engineering/infinitex-canonical-integration-candidate
  pull_request:
    branches:
      - main
      - eng/infinitex-p0-p1-auth-2026-11-20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinitex-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, audit, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v7

      - name: Configure Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=low

      - name: TypeScript lint
        run: npm run lint

      - name: Unit and regression tests
        run: npm test

      - name: Edge function and worker security tests
        run: npm run test:edge-function-security

      - name: Run Deno worker regression suite
        run: npx --yes deno@2.2.12 test --no-lock supabase/functions/_shared/worker-security.deno.ts
      - name: Type-check authenticated workflow worker
        run: npx --yes deno@2.2.12 check --node-modules-dir=auto --no-lock supabase/functions/simula-workflow-worker/index.ts
      - name: Type-check cron workflow worker
        run: npx --yes deno@2.2.12 check --node-modules-dir=auto --no-lock supabase/functions/simula-workflow-cron-worker/index.ts
      - name: Production build
        run: npm run build
