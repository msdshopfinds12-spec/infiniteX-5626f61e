name: Phase 4N.27 Vite 8 Lockfile Sync

on:
  push:
    branches:
      - eng/phase-4n27-transactional-fencing-verification
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: phase-4n27-vite8-lockfile-sync
  cancel-in-progress: false

jobs:
  lockfile:
    name: Resolve and commit the reviewed npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Resolve package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit only the generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile for Vite 8"
          git push origin "HEAD:${GITHUB_REF_NAME}"
