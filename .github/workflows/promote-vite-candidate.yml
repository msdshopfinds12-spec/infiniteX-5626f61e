name: Promote verified Vite candidate

on:
  push:
    branches:
      - chore/infiniteX-vite6-candidate
    paths:
      - ".github/workflows/promote-vite-candidate.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-vite-candidate
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated candidate branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Download and verify exact candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14309204038/zip" \
            --output candidate.zip
          echo "b98ff398aa452cffb63c4e31aa5d183ad4f8415a0364fe5c8ba9e82ee6577ac1  candidate.zip" | sha256sum --check
          mkdir candidate
          unzip -q candidate.zip -d candidate
          test "$(find candidate -maxdepth 1 -type f | wc -l)" -eq 2
          test -f candidate/package.json
          test -f candidate/package-lock.json
          node -e "const p=require('./candidate/package.json'); const l=require('./candidate/package-lock.json'); if(p.devDependencies?.vite!=='^6.4.6'||l.packages?.['']?.devDependencies?.vite!=='^6.4.6'||l.packages?.['node_modules/vite']?.version!=='6.4.6') process.exit(1)"
          cp candidate/package.json ./package.json
          cp candidate/package-lock.json ./package-lock.json

      - name: Install exact locked dependencies
        run: npm ci

      - name: Verify resolved toolchain
        run: npm ls vite esbuild @vitejs/plugin-react

      - name: Enforce dependency security audit
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Commit both manifests together
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m "chore(deps): promote verified Vite 6 candidate"
          git push origin HEAD:chore/infiniteX-vite6-candidate
