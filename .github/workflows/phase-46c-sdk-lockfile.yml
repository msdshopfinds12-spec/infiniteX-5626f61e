name: InfiniteX Phase 46C SDK lockfile candidate

on:
  push:
    branches: [eng/infinitex-p0-p1-auth-2026-11-20]
    paths:
      - ".github/workflows/phase-46c-sdk-lockfile.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [eng/infinitex-unified-ui-backend-2026-11-20]
    paths:
      - ".github/workflows/phase-46c-sdk-lockfile.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate npm lockfile using exact SDK version
        run: npm install --package-lock-only --ignore-scripts --save-exact @supabase/supabase-js@2.119.2

      - name: Verify manifest and lockfile agree
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = '2.119.2';
          if (pkg.dependencies?.['@supabase/supabase-js'] !== expected) {
            throw new Error('package.json does not pin the reviewed SDK version');
          }
          if (lock.packages?.['']?.dependencies?.['@supabase/supabase-js'] !== expected) {
            throw new Error('package-lock root dependency does not match package.json');
          }
          if (lock.packages?.['node_modules/@supabase/supabase-js']?.version !== expected) {
            throw new Error('lockfile did not resolve the exact reviewed SDK version');
          }
          console.log('Manifest/lockfile exact-version contract: PASS');
          NODE

      - name: Verify clean installation and audit
        run: |
          npm ci --ignore-scripts
          npm audit

      - name: Upload generated manifest and lockfile for reviewed atomic commit
        uses: actions/upload-artifact@v4
        with:
          name: infinitex-phase-46c-sdk-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 3
