name: InfiniteX Edge Function security regression

on:
  pull_request:
    branches:
      - eng/infinitex-unified-ui-backend-2026-11-20

permissions:
  contents: read

concurrency:
  group: infinitex-edge-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-regression:
    name: Node 22 security regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record runtime and commit
        run: |
          node --version
          git rev-parse HEAD
      - name: Run source contract and runtime security tests
        run: node --test tests/*.test.mjs
