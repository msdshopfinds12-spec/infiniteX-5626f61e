name: InfiniteX Quality Gates

on:
  pull_request:
    branches:
      - eng/infinitex-unified-ui-backend-2026-11-20
      - eng/infinitex-p0-p1-auth-2026-11-20
      - feat/phase-50-trusted-authorization
      - feat/phase-51-durable-workflow-engine
      - feat/phase-60-transactional-retry-orchestration
  push:
    branches:
      - eng/infinitex-p0-p1-auth-2026-11-20
      - feat/phase-51-durable-workflow-engine

permissions:
  contents: read

concurrency:
  group: infinitex-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, audit, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: infinitex_test
          POSTGRES_PASSWORD: infinitex_test_only
          POSTGRES_DB: infinitex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infinitex_test -d infinitex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=low

      - name: TypeScript lint
        run: npm run lint

      - name: Unit and regression tests
        run: npm test

      - name: Edge Function and worker security tests
        run: npm run test:edge-function-security

      - name: PostgreSQL 17 transaction and concurrency contract
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
          POSTGRES_USER: infinitex_test
          POSTGRES_DB: infinitex_test
        run: bash tests/postgres/run-phase-62.sh

      - name: Production build
        run: npm run build
