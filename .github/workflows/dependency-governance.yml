name: Dependency Governance

on:
  pull_request:
    branches:
      - main
      - fix/phase-4m2c-deno-tenant-isolation
      - feat/phase-4m2f-release-integrity
  push:
    branches:
      - feat/phase-4m4f-dependency-governance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-governance:
    name: Audit, SBOM and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source (immutable action pin)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js (immutable action pin)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Test dependency policy logic
        run: node --test scripts/dependency-policy.test.mjs

      - name: Generate CycloneDX SBOM
        if: steps.install.outcome == 'success'
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Enforce dependency security policy
        if: steps.install.outcome == 'success'
        run: node scripts/dependency-policy.mjs --output dependency-audit-report.json

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dependency-governance-evidence
          path: |
            dependency-audit-report.json
            sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 14
