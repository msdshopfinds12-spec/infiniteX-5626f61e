name: Phase 4N.8B PostgreSQL 17 Contract Verification

on:
  push:
    branches:
      - audit/phase-4n8b-live-schema-preflight
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-4n8b-postgres17-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contract:
    name: Independent-session transactional fencing contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify disposable PostgreSQL major version
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "show server_version_num" | awk '$1 >= 170000 && $1 < 180000 { ok=1 } END { exit !ok }'
      - name: Run isolated synthetic-schema concurrency contract
        run: bash supabase/tests/run-phase-4n8b-postgres-contract.sh
