name: Phase 4N.4 Retry Reliability
on:
  push:
    branches:
      - fix/phase-4n4-retry-reliability
  pull_request:
    branches:
      - fix/phase-4n3-step-budget-enforcement
permissions:
  contents: read
concurrency:
  group: phase-4n4-retry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retry-and-worker-tests:
    name: Node and Deno reliability verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (immutable action pin)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js (immutable action pin)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run retry reliability regression tests
        run: node --test supabase/functions/_shared/retry-reliability.test.mjs
      - name: Run existing worker security tests
        run: npm run test:edge-worker-security
      - name: Run existing CORS tests
        run: npm run test:edge-function-cors
      - name: Set up Deno (immutable action pin)
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.8
      - name: Run Deno retry regression tests
        run: deno test --no-lock supabase/functions/_shared/retry-reliability.deno.ts
      - name: Run existing Deno worker security tests
        run: deno test --no-lock supabase/functions/_shared/worker-security.deno.ts
      - name: Type-check authenticated and cron workers
        run: |
          deno check --node-modules-dir=auto --no-lock supabase/functions/simula-workflow-worker/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/simula-workflow-cron-worker/index.ts
      - name: Typecheck and build application
        run: npm run build
