name: InfiniteX Phase 78 Frontend Runtime Verification

on:
  push:
    branches:
      - phase-78/frontend-runtime-verification
    paths:
      - ".github/workflows/phase-78-frontend-runtime-verification.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "supabase/functions/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
  pull_request:
    branches:
      - main
      - eng/infinitex-unified-ui-backend-2026-11-20
    paths:
      - ".github/workflows/phase-78-frontend-runtime-verification.yml"
      - "src/**"
      - "tests/**"
      - "supabase/functions/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinitex-phase-78-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-runtime:
    name: Node 22 / Auth and frontend regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Record runtime versions
        run: |
          node --version
          npm --version

      - name: Install reproducibly from lockfile
        run: npm ci

      - name: TypeScript and project lint
        run: npm run lint

      - name: Complete unit and regression suite
        run: npm test

      - name: Auth lifecycle regression
        run: node --experimental-strip-types --test src/features/auth/*.test.ts

      - name: Authenticated read-service regression
        run: node --experimental-strip-types --test src/features/profile/*.test.ts src/features/projects/*.test.ts src/features/workflows/*.test.ts

      - name: Browser secret boundary regression
        run: node --test tests/browser-secret-boundary.test.mjs

      - name: Edge Function and worker security regression
        run: npm run test:edge-function-security

      - name: Configure Deno runtime
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Deno worker runtime unit and HTTP-handler regression
        run: deno test --no-check --allow-env supabase/functions/_shared/worker-security.deno.ts supabase/functions/simula-workflow-worker/index.deno.ts

      - name: Install ephemeral Playwright browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Production bundle compilation
        run: npm run build

      - name: Start isolated production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/infinitex-preview.log 2>&1 &
          echo $! > /tmp/infinitex-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/infinitex-preview.log
          exit 1

      - name: Chromium browser smoke and responsive regression
        run: node scripts/phase-78-browser-smoke.mjs

      - name: Upload build artifact for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infinitex-phase-78-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
