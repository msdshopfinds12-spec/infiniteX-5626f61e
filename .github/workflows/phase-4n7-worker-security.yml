name: Phase 4N.7 Worker Security and Application Build

on:
  push:
    branches:
      - feat/phase-4n7-workflow-reliability
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-4n7-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-security:
    name: Install, application build, and worker security regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Record runtime and commit
        run: |
          node --version
          npm --version
          git rev-parse HEAD
      - name: Install locked dependencies
        run: npm ci
      - name: Build application and type-check TypeScript
        run: npm run build
      - name: Run worker security tests
        run: npm run test:edge-function-security
