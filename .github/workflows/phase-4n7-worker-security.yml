name: Phase 4N.7 Worker Security

on:
  push:
    branches:
      - feat/phase-4n7-workflow-reliability
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-security:
    name: Node worker security regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Record runtime
        run: node --version
      - name: Run worker security tests
        run: npm run test:edge-function-security
