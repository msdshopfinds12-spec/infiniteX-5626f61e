name: Database Contract Gate
on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/check-*.mjs"
      - "scripts/verify-recovered-migration-manifest.mjs"
      - "scripts/audit-migration-side-effects.mjs"
      - "tests/database/migration-side-effect-audit.test.mjs"
      - "tests/database/catalog-capture-readonly.test.mjs"
      - "supabase/contracts/capture-database-contract.readonly.sql"
      - "tests/database/**"
      - "docs/database/**"
      - ".github/workflows/database-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-contract:
    name: Offline migration and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check validation scripts and tests
        run: |
          node --check scripts/check-migration-integrity.mjs
          node --check scripts/check-database-contract.mjs
          node --check scripts/verify-recovered-migration-manifest.mjs
          node --check scripts/verify-migration-provenance.mjs
          node --check scripts/audit-migration-side-effects.mjs
          node --check tests/database/migration-side-effect-audit.test.mjs
          node --check tests/database/catalog-capture-readonly.test.mjs
          node --check tests/database/check-database-contract.test.mjs
          node --check tests/database/check-migration-integrity.test.mjs
          node --check tests/database/platform-api-key-column-grants.test.mjs
          node --check tests/database/migration-provenance.test.mjs
          node --check tests/database/phase-52-1b-postgres-security.test.mjs
      - name: Verify applied versus candidate migration provenance
        run: node scripts/verify-migration-provenance.mjs
      - name: Run migration provenance regression tests
        run: node --test tests/database/migration-provenance.test.mjs
      - name: Verify recovered migration SHA-256 manifest
        run: node scripts/verify-recovered-migration-manifest.mjs
      - name: Audit recovered migration side effects against reviewed policy
        run: node scripts/audit-migration-side-effects.mjs
      - name: Run read-only catalog capture regression tests
        run: node --test tests/database/catalog-capture-readonly.test.mjs
      - name: Run migration side-effect audit regression tests
        run: node --test tests/database/migration-side-effect-audit.test.mjs
      - name: Run database contract validator regression tests
        run: node --test tests/database/check-database-contract.test.mjs
      - name: Run API-key column privilege regression tests
        run: node --test tests/database/platform-api-key-column-grants.test.mjs
      - name: Run Phase 52.1B PostgreSQL harness guard tests
        run: node --test tests/database/phase-52-1b-postgres-security.test.mjs
      - name: Run migration integrity regression tests
        run: node --test tests/database/check-migration-integrity.test.mjs
      - name: Check migration naming and content integrity
        id: migration_integrity
        shell: bash
        run: |
          set +e
          node scripts/check-migration-integrity.mjs
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 2 ]; then
            echo "Source unavailable: classified as BLOCKED, not a validator defect."
            exit 0
          fi
          exit "$status"
      - name: Validate reviewed database contract snapshot
        id: contract_snapshot
        if: always() && steps.migration_integrity.outcome != 'skipped'
        shell: bash
        run: |
          set +e
          node scripts/check-database-contract.mjs
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 2 ]; then
            echo "Contract snapshot unavailable or awaiting explicit human approval: classified as BLOCKED."
            exit 0
          fi
          exit "$status"
      - name: Summarize source readiness
        if: always()
        env:
          MIGRATION_EXIT_CODE: ${{ steps.migration_integrity.outputs.exit_code }}
          CONTRACT_EXIT_CODE: ${{ steps.contract_snapshot.outputs.exit_code }}
        run: |
          classify() {
            case "$1" in
              0) echo "PASS" ;;
              2) echo "BLOCKED — source missing or human approval pending" ;;
              "") echo "NOT RUN" ;;
              *) echo "FAIL — validator detected invalid source (exit $1)" ;;
            esac
          }
          {
            echo "## Database source readiness"
            echo "- Migration source: $(classify "$MIGRATION_EXIT_CODE")"
            echo "- Contract snapshot: $(classify "$CONTRACT_EXIT_CODE")"
            echo "- Missing historical migrations must be recovered, not fabricated."
            echo "- Captured snapshots require explicit human approval."
            echo "- Structural validity is not proof of schema parity."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce merge-blocking source readiness gate
        if: always()
        env:
          MIGRATION_EXIT_CODE: ${{ steps.migration_integrity.outputs.exit_code }}
          CONTRACT_EXIT_CODE: ${{ steps.contract_snapshot.outputs.exit_code }}
        run: |
          if [ "$MIGRATION_EXIT_CODE" != "0" ] || [ "$CONTRACT_EXIT_CODE" != "0" ]; then
            echo "BLOCKED: authoritative migration sources and human-approved contract snapshot are required."
            exit 1
          fi
  production-safety:
    name: Production safety invariant
    runs-on: ubuntu-latest
    steps:
      - name: Confirm no production credentials are configured
        run: |
          echo "This workflow is offline-only."
          echo "No Supabase URL, service-role key, database password, or production mutation command is used."
          echo "Production migration and deployment require a separate human-approved workflow."

  postgresql-readonly-sql:
    name: PostgreSQL 17 disposable catalog execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infinitex_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infinitex_contract_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute metadata-only catalog query on disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: infinitex_contract_test
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE infinitex_contract_reader NOLOGIN;
          CREATE SCHEMA private;
          CREATE TABLE public.contract_probe (id bigint, private_note text);
          CREATE SEQUENCE public.contract_probe_seq;
          GRANT SELECT ON public.contract_probe TO infinitex_contract_reader;
          GRANT SELECT (private_note) ON public.contract_probe TO infinitex_contract_reader;
          GRANT USAGE ON SEQUENCE public.contract_probe_seq TO infinitex_contract_reader;
          GRANT USAGE ON SCHEMA private TO infinitex_contract_reader;
          SQL
          psql -X -v ON_ERROR_STOP=1 -qAt -f supabase/contracts/capture-database-contract.readonly.sql > /tmp/database-contract-snapshot.json
          node --input-type=module -e "import fs from 'node:fs'; const s=JSON.parse(fs.readFileSync('/tmp/database-contract-snapshot.json','utf8')); const t=s.tables.find(x=>x.schema==='public'&&x.name==='contract_probe'); if(s.schemaVersion!==2 || s.reviewStatus!=='PENDING_HUMAN_REVIEW' || !Array.isArray(s.tables) || !Array.isArray(s.schemas) || !t?.grants.some(x=>x.grantor==='postgres'&&x.grantee==='infinitex_contract_reader'&&x.privilege==='SELECT') || !t?.columnGrants.some(x=>x.grantor==='postgres'&&x.grantee==='infinitex_contract_reader'&&x.column==='private_note') || !s.schemas.find(x=>x.name==='private') ) process.exit(1); console.log('PostgreSQL 17 catalog query passed: relation, column, and schema ACL metadata captured; human review remains pending.');"


  postgresql-security-behavior:
    name: PostgreSQL 17 disposable security behavior tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infinitex_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infinitex_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute actual migration security behavior suite on disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: infinitex_security_test
        run: psql -X -v ON_ERROR_STOP=1 -f tests/database/phase-52-1b-postgres-security.sql
