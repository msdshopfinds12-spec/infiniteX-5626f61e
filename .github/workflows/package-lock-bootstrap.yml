name: API Lockfile Bootstrap (temporary)

on:
  push:
    branches:
      - feat/provider-neutral-billing-sandbox
    paths:
      - ".github/workflows/package-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm lockfile
        working-directory: apps/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile for reviewed import
        uses: actions/upload-artifact@v4
        with:
          name: api-package-lock-${{ github.sha }}
          path: apps/api/package-lock.json
          if-no-files-found: error
          retention-days: 1
