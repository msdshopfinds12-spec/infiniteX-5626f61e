name: Foundation CI

on:
  push:
    branches:
      - main
      - "phase-*/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Bound resource usage and supersede obsolete runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package and test tools
        id: install-python
        run: python -m pip install -e ".[dev]"
      - name: Enforce Ruff on changed Python files
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$PUSH_BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -n "$BASE_SHA" ]]; then
            mapfile -d '' changed_files < <(
              git diff --name-only --diff-filter=ACMRT -z "$BASE_SHA" "$GITHUB_SHA" -- '*.py'
            )
          else
            mapfile -d '' changed_files < <(git ls-files -z '*.py')
          fi
          if (("${#changed_files[@]}" > 0)); then
            python -m ruff check "${changed_files[@]}"
          else
            echo "No changed Python files require Ruff checks."
          fi
      - name: Report full-repository Ruff baseline (non-blocking)
        continue-on-error: true
        run: python -m ruff check .
      - name: Run Python tests
        if: ${{ always() && steps.install-python.outcome == 'success' }}
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run lint --workspace frontend
      - name: Build frontend
        run: npm run build --workspace frontend
