name: InfiniteX CI

# Reproducible validation uses the committed package-lock.json.

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinitex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, type-check, test, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check application sources
        run: npm run lint

      - name: Type-check server gateway
        run: npm run typecheck:server

      - name: Run automated tests
        run: npm test

      - name: Enforce high and critical dependency audit gate
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build
