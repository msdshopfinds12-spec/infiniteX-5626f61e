name: InfiniteX CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinitex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Build production assets
        run: npm run build
