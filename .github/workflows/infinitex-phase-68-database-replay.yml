name: InfiniteX Phase 68 Disposable PostgreSQL Replay

on:
  push:
    branches:
      - engineering/infinitex-canonical-integration-candidate
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "docs/database/PHASE-52.1*"
      - "docs/database/PHASE-68-CANONICAL-MIGRATION-SOURCE-RECOVERY.md"
      - "docs/engineering/**"
      - "docs/database/live-schema-metadata.snapshot.json"
      - "scripts/rehearse-migration-chain.mjs"
      - "scripts/test-workflow-claim-stress.sh"
      - "tests/database/phase-52-1*"
      - "tests/database/phase-63-*"
      - "tests/database/run-phase-63-*"
      - ".github/workflows/infinitex-phase-68-database-replay.yml"

permissions:
  contents: read

concurrency:
  group: infinitex-phase-68-database-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgresql-security-behavior:
    name: PostgreSQL 17 disposable replay and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run replay harness and provenance classification tests
        run: node --test tests/database/phase-52-1c-migration-rehearsal.test.mjs
      - name: Start isolated Supabase PostgreSQL 17 container with scheduled jobs disabled
        shell: bash
        run: |
          docker run -d --name infinitex-phase68-replay \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=supabase_admin \
            -e POSTGRES_DB=infinitex_rehearsal \
            -p 5432:5432 \
            supabase/postgres:17.6.1.136 \
            postgres -c config_file=/etc/postgresql/postgresql.conf \
              -c shared_preload_libraries=pg_stat_statements,pgaudit,plpgsql,plpgsql_check,pg_cron,pg_net,pgsodium,auto_explain,pg_tle,plan_filter,supabase_vault \
              -c pgsodium.getkey_script=/usr/lib/postgresql/bin/pgsodium_getkey.sh \
              -c vault.getkey_script=/usr/lib/postgresql/bin/pgsodium_getkey.sh \
              -c cron.database_name=infinitex_rehearsal \
              -c cron.launch_active_jobs=off
          for attempt in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U supabase_admin -d infinitex_rehearsal; then
              exit 0
            fi
            sleep 2
          done
          docker logs infinitex-phase68-replay
          exit 1
      - name: Replay recovered migration chain in disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: supabase_admin
          PGPASSWORD: postgres
          PGDATABASE: infinitex_rehearsal
        run: node scripts/rehearse-migration-chain.mjs
      - name: Exercise concurrent claims, lease recovery, and generation fencing
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: supabase_admin
          PGPASSWORD: postgres
          PGDATABASE: infinitex_rehearsal
        run: bash scripts/test-workflow-claim-concurrency.sh
      - name: Stress parallel workflow claims and duplicate step-run inserts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: supabase_admin
          PGPASSWORD: postgres
          PGDATABASE: infinitex_rehearsal
        run: bash scripts/test-workflow-claim-stress.sh
      - name: Create isolated security test database
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: supabase_admin
          PGPASSWORD: postgres
        run: createdb --maintenance-db=postgres infinitex_security_test
      - name: Execute disposable PostgreSQL security behavior suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: supabase_admin
          PGPASSWORD: postgres
          PGDATABASE: infinitex_security_test
        run: psql -X -v ON_ERROR_STOP=1 -f tests/database/phase-52-1b-postgres-security.sql
      - name: Create isolated Phase 63 retry regression database
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: supabase_admin
          PGPASSWORD: postgres
        run: createdb --maintenance-db=postgres infinitex_phase63_retry
      - name: Prove old retry lookup fails and corrected lookup passes
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: supabase_admin
          PGPASSWORD: postgres
          PGDATABASE: infinitex_phase63_retry
        run: bash tests/database/run-phase-63-retry-idempotency-regression.sh
      - name: Collect disposable PostgreSQL logs
        if: always()
        run: docker logs infinitex-phase68-replay 2>&1 | tail -n 200 || true
      - name: Remove disposable PostgreSQL container
        if: always()
        run: docker rm -f infinitex-phase68-replay || true
