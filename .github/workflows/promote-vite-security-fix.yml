name: Prepare Vite Security Fix Draft PR

on:
  push:
    branches:
      - feat/gh16-infiniteX-integration
    paths:
      - ".github/workflows/promote-vite-security-fix.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-vite-security-pr
  cancel-in-progress: false

jobs:
  verify-and-open-draft-pr:
    name: Verify candidate and open isolated draft PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/gh16-infiniteX-integration

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Generate candidate Vite 6 lockfile
        run: npm install --package-lock-only --ignore-scripts --save-dev vite@^6.4.6

      - name: Install exact candidate dependency tree
        run: npm ci

      - name: Verify resolved dependency versions
        run: npm ls vite esbuild @vitejs/plugin-react

      - name: Enforce dependency security audit
        run: npm audit --audit-level=moderate

      - name: TypeScript checks
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Prepare isolated candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/vite-6-security-candidate
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Candidate files already match the source branch. No PR is needed."
            exit 0
          fi
          git commit -m "fix(security): upgrade Vite to patched 6.4.6"
          git push --force-with-lease origin HEAD:automation/vite-6-security-candidate
          existing_pr="$(gh pr list --head automation/vite-6-security-candidate --base feat/gh16-infiniteX-integration --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Draft PR #$existing_pr already exists; candidate branch updated."
          else
            gh pr create \
              --draft \
              --base feat/gh16-infiniteX-integration \
              --head automation/vite-6-security-candidate \
              --title "fix(security): promote verified Vite 6.4.6 candidate" \
              --body "## Security remediation candidate

This draft PR contains only the generated `package.json` and `package-lock.json`.

### Required checks
- `npm ci`
- `npm ls vite esbuild @vitejs/plugin-react`
- `npm audit --audit-level=moderate`
- `npm run lint`
- `npm test`
- `npm run build`

### Safety
- Isolated candidate branch: `automation/vite-6-security-candidate`
- Base: `feat/gh16-infiniteX-integration`
- No merge, deployment, migration, or production change is performed.
- Keep this PR in draft until a human reviews the dependency diff and CI checks."
          fi

      - name: Upload candidate manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vite-security-pr-candidate
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
