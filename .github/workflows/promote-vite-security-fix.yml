name: Promote Verified Vite Security Fix

on:
  workflow_dispatch:
    inputs:
      apply_candidate:
        description: "Set true to commit the tested package.json and package-lock.json to this feature branch"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: promote-vite-security-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-promote:
    name: Verify candidate, then optionally commit
    if: github.ref == 'refs/heads/feat/gh16-infiniteX-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/gh16-infiniteX-integration

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Generate Vite 6.4.6+ candidate lockfile
        run: npm install --package-lock-only --ignore-scripts --save-dev vite@^6.4.6

      - name: Install from candidate lockfile
        run: npm ci

      - name: Verify resolved dependencies
        run: npm ls vite esbuild @vitejs/plugin-react

      - name: Enforce dependency audit
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit candidate files only after all checks pass
        if: ${{ inputs.apply_candidate == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to promote."
            exit 0
          fi
          git commit -m "fix(security): upgrade Vite to patched 6.4.6"
          git push origin HEAD:feat/gh16-infiniteX-integration

      - name: Report verification-only mode
        if: ${{ inputs.apply_candidate != true }}
        run: echo "Checks passed. No repository files were committed because apply_candidate was false."
