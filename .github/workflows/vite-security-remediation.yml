name: Vite 8 Security Verification

on:
  push:
    branches:
      - feat/gh16-infiniteX-integration
      - chore/phase-3d4-p0-hardening
      - feat/phase-3d4-trusted-backend
      - fix/phase-4m4-picomatch-security-recovery
      - fix/phase-4m4-picomatch-regression-tests
    paths:
      - ".github/workflows/vite-security-remediation.yml"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vite.config.ts"
      - "tests/security/**"
  pull_request:
    branches:
      - feat/gh16-infiniteX-integration
      - feat/phase-3d4-trusted-backend
      - fix/phase-4m2c-deno-tenant-isolation
    paths:
      - ".github/workflows/vite-security-remediation.yml"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vite.config.ts"
      - "tests/security/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vite-security-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-toolchain:
    name: Verify locked Vite 8 toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source (immutable action pin)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js (immutable action pin)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact locked dependencies
        run: npm ci
      - name: Verify Vite toolchain versions
        run: npm ls vite esbuild @vitejs/plugin-react
      - name: Enforce dependency security audit
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build production assets
        run: npm run build
