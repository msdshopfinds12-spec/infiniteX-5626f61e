name: Vite 8 compatibility candidate

on:
  push:
    branches:
      - chore/infiniteX-vite8-candidate
    paths:
      - ".github/workflows/vite8-candidate.yml"

permissions:
  contents: write

concurrency:
  group: infinitex-vite8-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: Upgrade, verify, and commit candidate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated candidate branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Upgrade Vite and React plugin to exact compatible versions
        run: npm install --save-dev --save-exact vite@8.3.7 @vitejs/plugin-react@6.3.0

      - name: Verify declared and resolved versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {
            vite: '8.3.7',
            '@vitejs/plugin-react': '6.3.0'
          };
          for (const [name, version] of Object.entries(expected)) {
            if (pkg.devDependencies?.[name] !== version) {
              throw new Error(`package.json mismatch for ${name}`);
            }
            if (lock.packages?.['']?.devDependencies?.[name] !== version) {
              throw new Error(`lock root mismatch for ${name}`);
            }
            if (lock.packages?.[`node_modules/${name}`]?.version !== version) {
              throw new Error(`resolved version mismatch for ${name}`);
            }
          }
          console.log('Exact Vite 8 and React plugin versions verified.');
          NODE
          npm ls vite @vitejs/plugin-react esbuild

      - name: Reinstall from lockfile
        run: npm ci

      - name: Enforce dependency security audit
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit both dependency manifests atomically
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m "chore(deps): test Vite 8 with compatible React plugin"
          git push origin HEAD:chore/infiniteX-vite8-candidate
