name: API CI

on:
  push:
    branches:
      - feature/infiniteX-platform-integrations
      - feat/infiniteX-phase-3c-security-ci
  pull_request:
    branches:
      - main
      - feature/infiniteX-platform-integrations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API typecheck, tests, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package.json

      # This API package currently has no committed package-lock.json.
      # npm install is temporary until a reviewed lockfile is committed.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
