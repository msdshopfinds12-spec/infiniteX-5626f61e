name: API CI

on:
  push:
    branches:
      - feature/infiniteX-platform-integrations
      - feat/infiniteX-phase-3c-security-ci
      - fix/phase-3c1-api-security-recovery
  pull_request:
    branches:
      - main
      - feature/infiniteX-platform-integrations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API typecheck, tests, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          # Temporary until the dedicated API package-lock.json is generated and committed.
          cache-dependency-path: apps/api/package.json

      # BLOCKED: the API package has no committed lockfile yet. This install resolves
      # semver ranges at run time and is not a reproducible substitute for npm ci.
      - name: Install dependencies (temporary bootstrap)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
