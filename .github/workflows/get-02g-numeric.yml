name: GET-02G Numeric Engine CI

on:
  push:
    branches:
      - feat/get-02g-numeric-precision
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: get-02g-numeric-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, regression tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency vulnerability summary
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities ?? {}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}))}, null, 2))'

      - name: TypeScript lint
        run: npm run lint

      - name: Numeric regression tests
        run: npm test

      - name: Production build
        run: npm run build
